server {
    listen 80;
    server_name _;

    location /health {
        proxy_pass http://healthcheck:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirect everything else to HTTPS if you have SSL configured
    # location / {
    #     return 301 https://$host$request_uri;
    # }
}
