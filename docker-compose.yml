services:
  backend:
    build: .
    command: python -m app.backend
    env_file: .env
    environment:
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "5000"
      DATABASE_URL: "sqlite:////data/telegram_call_bot.db"
    ports:
      - "5000:5000"
    volumes:
      - db_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  bot:
    build: .
    command: python main.py
    env_file: .env
    environment:
      BACKEND_API_BASE_URL: "http://backend:5000/api"
      DATABASE_URL: "sqlite:////data/telegram_call_bot.db"
    volumes:
      - db_data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
